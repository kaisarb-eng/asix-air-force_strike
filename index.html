<script>
'use strict';
/* =====================================================================
   ASIX AIR FORCE STRIKE - Asix Studio / Asix Academy
   Satu file, tanpa library luar. Semua gambar & suara dibuat lewat kode.
   ===================================================================== */
const W = 480;
let H = 800;
const MAPH = 800, TW = 240, TH = 400;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let K = 1;

/* ---------- util ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function compact(a) { let j = 0; for (let i = 0; i < a.length; i++) { if (!a[i].dead) a[j++] = a[i]; } a.length = j; }

/* ---------- penyimpanan aman (localStorage bisa diblokir di iframe) ---------- */
const Store = {
  m: {},
  get(k) {
    try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
    return this.m[k] === undefined ? null : this.m[k];
  },
  set(k, v) {
    this.m[k] = String(v);
    try { window.localStorage.setItem(k, String(v)); } catch (e) {}
  }
};

/* ---------- suara ----------
   Mode A = Web Audio (default). Mode B = file WAV kecil yang dibuat lewat kode, diputar
   lewat elemen audio biasa (cadangan untuk HP yang Web Audio-nya diam). */
const SND = {
  shoot: [['t', 'square', 900, 380, 0.09, 0.16, 0]],
  boomS: [['n', 0.32, 0.9, 2200], ['t', 'sawtooth', 220, 35, 0.25, 0.35, 0]],
  boomB: [['n', 0.8, 1.4, 1100], ['t', 'sawtooth', 140, 35, 0.55, 0.5, 0]],
  hit: [['t', 'sawtooth', 260, 60, 0.25, 0.45, 0], ['n', 0.18, 0.8, 1500]],
  pick: [['t', 'square', 660, 660, 0.08, 0.22, 0], ['t', 'square', 990, 990, 0.12, 0.22, 0.08]],
  warn: [['t', 'square', 520, 520, 0.2, 0.22, 0], ['t', 'square', 390, 390, 0.2, 0.22, 0.22]],
  clear: [523, 659, 784, 1046].map((f, i) => ['t', 'square', f, f, 0.16, 0.22, i * 0.12]),
  over: [['t', 'sawtooth', 420, 50, 1.0, 0.4, 0]]
};
const Sfx = {
  ctx: null, master: null, nb: null, muted: Store.get('asix_af_mute') === '1', last: 0, primed: false,
  mode: Store.get('asix_af_amode') === 'b' ? 'b' : 'a', wav: {}, widx: {}, wavReady: false, bad: 0,
  init() {
    try {
      if (this.mode === 'b') this.initWav();
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = new AC();
        this.ctx = c;
        this.master = c.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
        this.master.connect(comp); comp.connect(c.destination);
        const len = c.sampleRate;
        this.nb = c.createBuffer(1, len, c.sampleRate);
        const d = this.nb.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      const c = this.ctx;
      if (c.state !== 'running') { const p = c.resume(); if (p && p.catch) p.catch(function () {}); }
      if (!this.primed) {
        const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
        if (c.state === 'running') this.primed = true;
      }
    } catch (e) {}
  },
  tone(type, f1, f2, d, v, delay) {
    if (!this.ctx || this.muted) return;
    if (this.ctx.state !== 'running') { this.init(); return; }
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  },
  noise(d, v, f) {
    if (!this.ctx || this.muted || !this.nb) return;
    if (this.ctx.state !== 'running') { this.init(); return; }
    try {
      const c = this.ctx, t = c.currentTime;
      const s = c.createBufferSource(); s.buffer = this.nb;
      const fl = c.createBiquadFilter(); fl.type = 'lowpass';
      fl.frequency.setValueAtTime(f, t);
      fl.frequency.exponentialRampToValueAtTime(100, t + d);
      const g = c.createGain();
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(fl); fl.connect(g); g.connect(this.master);
      s.start(t); s.stop(t + d + 0.05);
    } catch (e) {}
  },
  /* ---- mode B: WAV buatan sendiri ---- */
  makeWav(list) {
    const R = 22050; let dur = 0;
    list.forEach(c => { dur = Math.max(dur, c[0] === 't' ? c[6] + c[4] : c[1]); });
    const N = Math.ceil((dur + 0.05) * R), buf = new Float32Array(N);
    list.forEach(c => {
      if (c[0] === 't') {
        const f1 = c[2], f2 = Math.max(20, c[3]), d = c[4], v = c[5], i0 = Math.floor(c[6] * R), n = Math.floor(d * R); let ph = 0;
        for (let i = 0; i < n && i0 + i < N; i++) {
          const k = i / n, f = f1 * Math.pow(f2 / f1, k); ph += f / R;
          const fr = ph - Math.floor(ph), w = c[1] === 'square' ? (fr < 0.5 ? 1 : -1) : (2 * fr - 1);
          buf[i0 + i] += w * v * Math.pow(0.0001 / v, k);
        }
      } else {
        const d = c[1], v = c[2], f0 = c[3], n = Math.min(N, Math.floor(d * R)); let y = 0;
        for (let i = 0; i < n; i++) {
          const k = i / n, fc = f0 * Math.pow(100 / f0, k), a = 1 - Math.exp(-6.2832 * fc / R);
          y += a * ((Math.random() * 2 - 1) - y);
          buf[i] += y * v * Math.pow(0.0001 / v, k) * 2.2;
        }
      }
    });
    const bytes = new Uint8Array(44 + N * 2), dv = new DataView(bytes.buffer);
    const ws = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
    ws(0, 'RIFF'); dv.setUint32(4, 36 + N * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, R, true); dv.setUint32(28, R * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, N * 2, true);
    for (let i = 0; i < N; i++) dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, buf[i])) * 30000, true);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return 'data:audio/wav;base64,' + btoa(bin);
  },
  initWav() {
    if (this.wavReady) return;
    try {
      for (const k in SND) {
        const uri = this.makeWav(SND[k]), arr = [];
        for (let i = 0; i < 3; i++) { const a = new Audio(uri); a.preload = 'auto'; arr.push(a); }
        this.wav[k] = arr; this.widx[k] = 0;
      }
      this.wavReady = true;
    } catch (e) { this.wavReady = false; }
  },
  playWav(name) {
    if (!this.wavReady) this.initWav();
    const arr = this.wav[name]; if (!arr) return;
    this.widx[name] = (this.widx[name] + 1) % arr.length;
    const a = arr[this.widx[name]];
    try { a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  },
  play(name) {
    if (this.muted) return;
    if (this.mode === 'b') { this.playWav(name); return; }
    const list = SND[name];
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      if (c[0] === 't') this.tone(c[1], c[2], c[3], c[4], c[5], c[6]); else this.noise(c[1], c[2], c[3]);
    }
  },
  setMode(m) {
    this.mode = m; Store.set('asix_af_amode', m); this.bad = 0;
    if (m === 'b') this.initWav(); else this.init();
  },
  watch(dt) { /* kalau Web Audio tetap diam 3 detik saat main, pindah otomatis ke mode B */
    if (this.mode !== 'a' || this.muted) { this.bad = 0; return; }
    const c = this.ctx;
    if (c && c.state === 'running') { this.bad = 0; return; }
    this.bad += dt;
    if (c) this.init();
    if (this.bad > 3) this.setMode('b');
  },
  shoot() { const n = performance.now(); if (n - this.last < 110) return; this.last = n; this.play('shoot'); },
  boom(big) { this.play(big ? 'boomB' : 'boomS'); },
  hit() { this.play('hit'); },
  pick() { this.play('pick'); },
  warn() { this.play('warn'); },
  clear() { this.play('clear'); },
  over() { this.play('over'); },
  setMute(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 1;
    Store.set('asix_af_mute', m ? '1' : '0');
  }
};

  } else if (pat === 2) { /* zig-zag beruntun */

/* ---------- peluru ---------- */

/* ---------- pemain ---------- */
function hurt(n) {

  P.hp -= n; P.inv = 1.6; shake = Math.max(shake, 0.35);

function updPlayer(dt) {
  if (P.dead) { P.dieT += dt; if (P.dieT > 1.7 && state === 'play') gameOver(); return; }
  let kx = 0, ky = 0;
  if (keys.left) kx -= 1; if (keys.right) kx += 1; if (keys.up) ky -= 1; if (keys.down) ky += 1;
  if (kx || ky) {
    const l = Math.hypot(kx, ky), s = 400;
    P.x += kx / l * s * dt; P.y += ky / l * s * dt; P.tx = P.x; P.ty = P.y;
  } else {
    const f = 1 - Math.exp(-16 * dt);
    P.x += (P.tx - P.x) * f; P.y += (P.ty - P.y) * f;
  }
  P.x = clamp(P.x, 26, W - 26); P.y = clamp(P.y, 70, H - 34);
  P.tx = clamp(P.tx, 26, W - 26); P.ty = clamp(P.ty, 70, H - 34);
  if (P.inv > 0) P.inv -= dt;

function updEnemy(e, dt) {

    if (e.sh < 900) { e.sh -= dt; if (e.sh <= 0 && e.y > 0 && e.y < H * 0.6) { eshot(e.x, e.y + 14, aim(e.x, e.y), 230 * b); e.sh = rnd(2, 3.8); } }

  } else if (e.t === 'fighter') {
    if (e.st === 0) { e.y += 130 * s * dt; if (e.y >= e.hy) { e.st = 1; e.t2 = 0; } }

      e.t2 += dt; e.x = clamp(e.bx + 60 * Math.sin(e.t2 * 1.2), 30, W - 30); e.y = e.hy + 8 * Math.sin(e.t2 * 2);

function updBoss(e, dt) {
  const L = level;
  if (e.dying) {
    e.dt += dt; e.y += 14 * dt; shake = Math.max(shake, 0.25); e.exT -= dt;
    if (e.exT <= 0) { e.exT = 0.11; explode(e.x + rnd(-e.hw, e.hw), e.y + rnd(-50, 50), Math.random() < 0.3 ? 1 : 0); }

/* ---------- pengatur level ---------- */
function updDirector(dt) {

    if (L >= 2 && lv.t > 5) { lv.tH -= dt; if (lv.tH <= 0) { spawnHeli(); lv.tH = Math.max(6, 11 - 0.7 * (L - 1)) * rnd(0.8, 1.3); } }

/* ---------- update utama ---------- */
function update(dt) {
  time += dt;
  if (state === 'pause') return;
  scrollY = (scrollY + (state === 'menu' ? 40 : scrollSpd()) * dt) % MAPH;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.2);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; const d = Math.pow(0.03, dt); p.vx *= d; p.vy *= d; p.l -= dt; if (p.l <= 0) p.dead = true;
  }
  for (let i = 0; i < rings.length; i++) { rings[i].l -= dt; if (rings[i].l <= 0) rings[i].dead = true; }

  if (state === 'menu') return;

  Sfx.watch(dt);
  updPlayer(dt);
  updDirector(dt);

  for (let i = 0; i < bullets.length; i++) {

      if (e.dead || e.dying) continue;
      if (e.t === 'boss' && !e.ready) continue;
      if (Math.abs(b.x - e.x) < e.hw + 3 && Math.abs(b.y - e.y) < e.hh + 8) {

  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (handleUI(p)) return;
  if (state === 'play') { inp.sx = p.x; inp.sy = p.y; inp.px = P.x; inp.py = P.y; setTarget(p, inp.type); }
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  const type = e.pointerType || 'mouse';
  if (type === 'mouse' || inp.down) setTarget(toLogical(e), type);
});
const up = () => { inp.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key;
  Sfx.init();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(k) >= 0) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = true;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = true;
  else if (k === 'p' || k === 'P' || k === 'Escape') { if (state === 'play') setPause(true); else if (state === 'pause') setPause(false); }
  else if (k === 'm' || k === 'M') toggleMute();
  else if (k === 'Enter' || k === ' ') {
    if (state === 'menu') newGame(); else if (state === 'pause') setPause(false); else if (state === 'over' && overT > 0.9) newGame();
  }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
});
['pointerdown', 'pointerup', 'touchend', 'mouseup', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => Sfx.init(), true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* ---------- ukuran layar ---------- */
function viewSize() {
  let vw = window.innerWidth || document.documentElement.clientWidth || 360;
  const vh = window.innerHeight || document.documentElement.clientHeight || 640;
  let left = false;
  try { /* HP layar sempit (mis. layar depan Z Fold): halaman bisa lebih lebar dari layar fisik -> pakai lebar layar & rata kiri */
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches && window.screen) {
      const land = window.matchMedia('(orientation:landscape)').matches;
      const a = window.screen.width, b = window.screen.height;
      const sw = land ? Math.max(a, b) : Math.min(a, b);
      if (sw > 0 && vw > sw * 1.02 && vw < sw * 1.5) { vw = sw; left = true; }
    }
  } catch (e) {}
  return [vw, vh, left];
}
function resize() {
  const v = viewSize(), vw = v[0], vh = v[1];
  if (vw < 50 || vh < 50) return;
  const wrap = document.getElementById('wrap');
  if (wrap) wrap.style.justifyContent = v[2] ? 'flex-start' : 'center';
  H = clamp(Math.round(W * vh / vw), 720, 1240);
  const s = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.max(1, Math.floor(W * s * dpr)); cv.height = Math.max(1, Math.floor(H * s * dpr));
  K = cv.width / W;
  if (P && !P.dead) { P.y = Math.min(P.y, H - 34); P.ty = Math.min(P.ty, H - 34); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
setTimeout(resize, 300); setTimeout(resize, 1200);

/* ---------- loop ---------- */
let last = 0;
function showErr(e) {
  console.error(e);
  if (errShown) return; errShown = true;
  const d = document.getElementById('err'); d.textContent = 'Error: ' + (e && e.message ? e.message : e); d.style.display = 'block';
}
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) return;
  try { update(dt); render(); } catch (e) { showErr(e); }
}
try {
  buildSprites();
  for (let i = 0; i < 3; i++) getTheme(i);
} catch (e) { showErr(e); }
resize();
requestAnimationFrame(frame);
</script>
</body>
